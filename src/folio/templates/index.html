{% extends "base.html" %}

{% block title %}Folio - Document Management{% endblock %}

{% block content %}
<hgroup>
    <h1>Folio</h1>
    <p>Self-hosted document management</p>
</hgroup>

{% if g.user %}
<div class="grid">
    <button type="button" onclick="location.href='{{ url_for('documents.index') }}'">Browse Documents</button>
    <button type="button" onclick="location.href='{{ url_for('documents.new') }}'" class="outline">New Document</button>
    <button type="button" onclick="location.href='{{ url_for('documents.search') }}'" class="secondary outline">Search</button>
</div>
{% else %}
<p>Please <a href="{{ url_for('auth.login') }}">log in</a> to access documents.</p>
{% endif %}
{% endblock %}
