{% extends "base.html" %}

{% block title %}Upload File - Folio{% endblock %}

{% block content %}
<h2>Upload File</h2>

{% if parent_path %}
<p>Uploading to: <strong>{{ parent_path }}/</strong></p>
{% endif %}

<form method="post" enctype="multipart/form-data">
    <label for="file">File</label>
    <input type="file" id="file" name="file" required>

    <div class="form-actions">
        <button type="submit">Upload</button>
        <button type="button" onclick="location.href='{{ url_for('documents.index', prefix=parent_path) }}'" class="outline secondary">Cancel</button>
    </div>
</form>
{% endblock %}
